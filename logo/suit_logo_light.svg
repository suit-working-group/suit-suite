<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512"
     viewBox="0 0 512 512">

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Top level: three hollow circles -->
  <line
    x1="174"
    y1="135"
    x2="222"
    y2="135"
    stroke="#000000"
    stroke-width="9"
    stroke-linecap="butt"
  />

  <circle cx="140" cy="135" r="34"
    fill="none" stroke="#000000" stroke-width="7" />

  <circle cx="256" cy="135" r="34"
    fill="none" stroke="#000000" stroke-width="7" />

  <circle cx="372" cy="135" r="34"
    fill="none" stroke="#000000" stroke-width="7" />

  <!-- Middle level: two filled triangles connected by a thin line -->
  <line
    x1="205"
    y1="260.5"
    x2="307"
    y2="260.5"
    stroke="#000000"
    stroke-width="9"
    stroke-linecap="butt"
  />

  <polygon
    points="205,228.0 171,293.0 239,293.0"
    fill="#000000"
  />

  <polygon
    points="307,228.0 273,293.0 341,293.0"
    fill="#000000"
  />

  <!-- Bottom level: filled square isolated inside a hollow square -->
  <rect
    x="210.0"
    y="352"
    width="92"
    height="92"
    fill="none"
    stroke="#000000"
    stroke-width="7"
  />

  <rect
    x="240.0"
    y="382.0"
    width="32"
    height="32"
    fill="#000000"
  />

</svg>
